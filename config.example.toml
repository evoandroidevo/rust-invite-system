[database]
url = "sqlite://./data/invites.db"

[server]
host = "127.0.0.1"
port = 8080

[ldap]
http_url = "http://127.0.0.1:17170"
ldap_url = "ldap://127.0.0.1:3890"
use_tls = false
tls_insecure_skip_verify = false
# tls_ca_file = "/path/to/custom-ca.pem"
base_dn = "dc=example,dc=com"

[invites]
expiration_hours = 48

[appearance]
default_theme = "light"

[password_policy]
minimum_length = 12
require_uppercase = true
require_lowercase = true
require_number = true
require_special = true